<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Are you a fridge ?</h1>
    <button id="toggle-btn" class="btn off">No</button>

    <div id="profile-info" class="profile-info hidden">
      <div class="info-row"><span class="label">UA</span><span id="info-ua" class="value"></span></div>
      <div class="info-row"><span class="label">Lang</span><span id="info-lang" class="value"></span></div>
      <div class="info-row"><span class="label">Screen</span><span id="info-screen" class="value"></span></div>
      <div class="info-row"><span class="label">GPU</span><span id="info-gpu" class="value"></span></div>
      <div class="info-row"><span class="label">TZ</span><span id="info-tz" class="value"></span></div>
      <div class="info-row"><span class="label">Cores</span><span id="info-cores" class="value"></span></div>

      <button id="details-toggle" class="btn-details">show more</button>
      <div id="full-details" class="full-details hidden">
        <div class="info-row"><span class="label">Platform</span><span id="info-platform" class="value"></span></div>
        <div class="info-row"><span class="label">Vendor</span><span id="info-vendor" class="value"></span></div>
        <div class="info-row"><span class="label">Product</span><span id="info-product" class="value"></span></div>
        <div class="info-row"><span class="label">BuildID</span><span id="info-buildid" class="value"></span></div>
        <div class="info-row"><span class="label">DNT</span><span id="info-dnt" class="value"></span></div>
        <div class="info-row"><span class="label">DevMem</span><span id="info-devmem" class="value"></span></div>
        <div class="info-row"><span class="label">Languages</span><span id="info-languages" class="value"></span></div>
        <div class="info-row"><span class="label">Avail</span><span id="info-avail" class="value"></span></div>
        <div class="info-row"><span class="label">Depth</span><span id="info-depth" class="value"></span></div>
        <div class="info-row"><span class="label">GL Vendor</span><span id="info-glvendor" class="value"></span></div>
        <div class="info-row"><span class="label">GL Render</span><span id="info-glrender" class="value"></span></div>
        <div class="info-row"><span class="label">TZ Offset</span><span id="info-tzoffset" class="value"></span></div>
        <div class="info-row"><span class="label">AcceptLang</span><span id="info-acceptlang" class="value"></span></div>
        <div class="info-row"><span class="label">Canvas</span><span id="info-canvas" class="value"></span></div>
        <div class="info-row"><span class="label">Audio</span><span id="info-audio" class="value"></span></div>
      </div>
    </div>

    <button id="new-session-btn" class="btn-action btn-green hidden">New Identity</button>

    <div class="separator"></div>

    <h2>Fake ID</h2>
    <button id="gen-identity-btn" class="btn-action btn-purple">Generate</button>

    <div id="identity-info" class="identity-info hidden">
      <div class="identity-row">
        <span class="label">Name</span>
        <span id="id-name" class="value copiable"></span>
        <span id="id-universe" class="value universe-tag"></span>
      </div>
      <div class="identity-row">
        <span class="label">Email</span>
        <span id="id-email" class="value copiable"></span>
      </div>
      <div class="identity-row">
        <span class="label">Address</span>
        <span id="id-address" class="value copiable"></span>
      </div>
      <div class="identity-row">
        <span class="label">City</span>
        <span id="id-city" class="value copiable"></span>
      </div>

      <button id="id-details-toggle" class="btn-details">show more</button>
      <div id="id-full-details" class="full-details hidden">
        <div class="identity-row">
          <span class="label">Phone</span>
          <span id="id-phone" class="value copiable"></span>
        </div>
        <div class="identity-row">
          <span class="label">Zip</span>
          <span id="id-zip" class="value copiable"></span>
        </div>
      </div>
    </div>

    <div id="mail-section" class="hidden">
      <div class="separator"></div>

      <h2>Temp Mail</h2>

      <div id="mail-no-box" class="mail-no-box">
        <button id="create-mail-btn" class="btn-action btn-purple">Create Mailbox</button>
      </div>

      <div id="mail-box" class="hidden">
        <div class="mail-address-bar">
          <span id="mail-address" class="mail-address copiable"></span>
          <button id="mail-refresh-btn" class="btn-icon" title="Refresh">↻</button>
          <button id="mail-delete-btn" class="btn-icon btn-icon-danger" title="Delete mailbox">✕</button>
        </div>

        <div id="mail-inbox" class="mail-inbox">
          <div id="mail-empty" class="mail-empty">No messages yet</div>
          <div id="mail-list"></div>
        </div>

        <div id="mail-view" class="mail-view hidden">
          <button id="mail-back-btn" class="btn-details">← back</button>
          <div class="mail-view-header">
            <div class="mail-view-from" id="mail-view-from"></div>
            <div class="mail-view-subject" id="mail-view-subject"></div>
            <div class="mail-view-date" id="mail-view-date"></div>
          </div>
          <div class="mail-view-body" id="mail-view-body"></div>
        </div>
      </div>

      <div id="mail-loading" class="mail-loading hidden">Loading...</div>
      <div id="mail-error" class="mail-error hidden"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
